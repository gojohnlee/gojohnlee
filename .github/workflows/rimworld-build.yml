name: RimWorld mod build

on:
  push:
    paths:
      - "rimworld/**"
      - ".github/workflows/rimworld-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mod: [HelloRimWorld]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build rimworld/${{ matrix.mod }}/Source/${{ matrix.mod }}/${{ matrix.mod }}.csproj -c Release
      - name: Package mod folder
        run: |
          mkdir -p dist/${{ matrix.mod }}
          rsync -a --exclude Source --exclude '.gitkeep' rimworld/${{ matrix.mod }}/ dist/${{ matrix.mod }}/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}
          path: dist/
