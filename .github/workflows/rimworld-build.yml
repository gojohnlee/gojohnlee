name: RimWorld mod build

on:
  push:
    paths:
      - "rimworld/**"
      - ".github/workflows/rimworld-build.yml"
  workflow_dispatch:

jobs:
  find-mods:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.list.outputs.mods }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "mods=$(ls -d rimworld/*/ | xargs -n1 basename | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: find-mods
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mod: ${{ fromJson(needs.find-mods.outputs.mods) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build rimworld/${{ matrix.mod }}/Source/${{ matrix.mod }}/${{ matrix.mod }}.csproj -c Release
      - name: Package mod folder
        run: |
          mkdir -p dist/${{ matrix.mod }}
          rsync -a --exclude Source --exclude '.gitkeep' rimworld/${{ matrix.mod }}/ dist/${{ matrix.mod }}/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}
          path: dist/

  # PC 설치 스크립트가 받아가는 고정 링크:
  # https://github.com/<owner>/<repo>/releases/download/rimworld-latest/rimworld-mods.zip
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Zip all mods
        run: cd artifacts && zip -qr ../rimworld-mods.zip .
      - name: Update rimworld-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete rimworld-latest --yes --cleanup-tag || true
          gh release create rimworld-latest rimworld-mods.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "RimWorld mods (latest build)" \
            --notes "자동 빌드: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
